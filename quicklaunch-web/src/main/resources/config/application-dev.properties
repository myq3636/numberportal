# RCS Phase 1 customer APIs and signed event delivery.
rcs.phase1.enabled=true
rcs.customer-events.enabled=false
rcs.customer-events.scan-ms=5000
# Base64-encoded 32-byte master key. Keep empty until configured securely.
rcs.event-secret-key=

# Infobip account-level RCS/REGISTRATION subscription reconciliation.
# Keep disabled until project.url is an externally reachable HTTPS URL.
rcs.infobip-subscriptions.enabled=false
rcs.infobip-subscriptions.scan-ms=300000
# Configure outside source control; sent by Infobip in
# X-RCS-Subscription-Token.
rcs.infobip-subscriptions.callback-token=

# Infobip simulator — exposes /rcs/2/messages and /rcs/1/senders/** on this
# server so local tests work without a real Infobip account.
# Point the supplier admin_info.url to http://localhost:8081/api/v1 and set
# any non-blank string as admin_info.app_id when this is true.
# DR callback delay and default status are tunable per test run.
infobip.simulator.enabled=true
infobip.simulator.dr-delay-ms=500
# DELIVERED | REJECTED | UNDELIVERABLE | EXPIRED | SEEN
infobip.simulator.dr-status=DELIVERED


